.arrow{color:#52525B}
.main{flex:1;display:flex;min-height:0}

.side{width:380px;flex-shrink:0;display:flex;flex-direction:column;background:#18181B;border-left:1px solid #333}
.side[hidden]{display:none}

.side-head h2{margin:0 0 4px;font-size:14px;font-weight:600}
.side-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reset-all{height:26px;padding:0 10px;border:1px solid #3F3F46;border-radius:6px;background:#27272A;color:#E4E4E7;font:600 12px inherit;font-family:inherit;cursor:pointer}
.reset-all:hover{background:#3F3F46}
.reset-all:disabled{opacity:.4;cursor:default}
.side-head p{margin:0 0 10px;color:#A1A1AA;font-size:12px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.preset{padding:8px 10px;border:1px solid #3F3F46;border-radius:8px;background:#27272A;text-align:left;cursor:pointer}
.preset:hover{border-color:#71717A}
.preset.on{border-color:#84CC16;background:rgba(132,204,22,.08)}
.preset strong{display:block;font-size:13px}
.preset span{display:block;color:#A1A1AA;font-size:11px}
.side-body{flex:1;overflow:auto;padding:4px 0 16px}
details{border-bottom:1px solid #2A2A2E}
summary{display:flex;align-items:center;gap:8px;padding:12px 16px;list-style:none;cursor:pointer;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid #71717A;border-bottom:2px solid #71717A;transform:rotate(45deg);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
.badge{min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:#84CC16;color:#18181B;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.opts{padding:0 16px 12px}
.opt{position:relative;display:flex;align-items:center;gap:10px;padding:6px 0 6px 10px;border-left:2px solid transparent}
.opt.changed{border-left-color:#84CC16}
.opt-top{flex:1;display:flex;align-items:center;gap:4px;min-width:0}
.opt-name{color:#F4F4F5}
.info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#3F3F46;color:#D4D4D8;font-size:10px;font-weight:700;cursor:help;flex-shrink:0}
.side{position:relative}
.hint-bar{position:absolute;left:16px;right:16px;bottom:14px;z-index:5;padding:10px 12px;border-radius:10px;background:#22301A;border:1px solid #3F6212;color:#D9F99D;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;transition:opacity .3s}
.hint-bar.fade{opacity:0}
.hint-bar[hidden]{display:none}
.undo{padding:0 2px;border:0;background:none;color:#84CC16;font-size:13px;cursor:pointer}
.opt .seg{display:flex;width:196px;flex-shrink:0}

.opt.wide{flex-wrap:wrap;row-gap:6px}
.opt-warn{margin:6px 0 0 10px;padding:8px 10px;border-radius:8px;background:rgba(245,165,36,.12);color:#FCD34D;font-size:12px;line-height:17px}
.opt.wide .opt-top{flex-basis:100%}
.opt.wide .seg{width:100%}
.site-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#84CC16}
.legend{display:flex;align-items:center;gap:6px;padding:10px 16px;color:#8B8B94;font-size:11px}
.status{display:inline-flex;align-items:center;gap:6px;color:#A1A1AA;white-space:nowrap}
@media (max-width:900px){
  .side{position:fixed;left:0;right:0;bottom:0;z-index:20;width:auto;max-height:70vh;border-left:0;border-top:1px solid #3F3F46;border-radius:14px 14px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
}

<head>

<title>IBSKUSD | Login</title>
<style>
/* ===== IBSKUSD auth page – tokens taken from the live /en-kh/login page ===== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",sfpro-en,"Helvetica Neue",Arial,sans-serif;
  --bg-desktop:#000000; --bg-mobile:#121212;
  --field-bg:#2B2B31; --field-border:#0E0E0F; --field-focus:#047857; --placeholder:#505050;
  --pill-bg:#222121; --grad:linear-gradient(rgb(132,204,22),rgb(4,120,87));
  --green:#047857; --error:#FF0B0B; --success:#0BB212; --warning:#F4B408; --info:#0093FF;
  --ink:#FFFFFF; --muted-2:rgba(255,255,255,.5); --popover:#1E1E22; --divider:#3A3A40; --raised:#1C1C1F; --btn-grey:#4A4A50; --hover:#2B2B31; --lime:#84CC16; --toggle-border:#5F5F5F; --muted:#C6C6C6; --required:var(--error);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg-desktop);color:var(--ink);font-family:var(--font)}
button{font-family:var(--font)}
button:focus-visible,a:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
input:focus{outline:none}

.page{min-height:100vh;padding:40px 32px 32px}
.page-inner{position:relative;max-width:960px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;align-items:center}
.close{position:absolute;right:16px;top:23px;line-height:0}
.logo{margin-top:16px;line-height:0}
.logo img{display:block;width:150px;height:60px;object-fit:contain}
.logo{text-decoration:none}
.logo-ph{display:flex;align-items:center;justify-content:center;width:150px;height:60px;border:1.5px dashed #9C9A9E;border-radius:8px;color:#9C9A9E;font-size:14px;font-weight:600;letter-spacing:.2em}
.proto-tag{position:fixed;left:12px;bottom:12px;z-index:60;padding:4px 10px;border-radius:99px;background:rgba(128,128,128,.15);color:#9C9A9E;font-size:11px;letter-spacing:.04em;pointer-events:none}
.auth{display:flex;flex-direction:column;width:100%;max-width:450px;margin-top:20px;padding-bottom:16px}
.title{padding:20px 0 10px;text-align:center;font-size:20px;font-weight:700;line-height:30px}

/* segmented pill (method tabs / login-signup tabs) */
.seg{display:grid;width:360px;margin:12px auto 0;padding:4px;background:var(--pill-bg);border-radius:30px}
.seg-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.seg-n2{width:240px}
.seg-btn{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:6.4px 8.64px;border:0;border-radius:30px;background:transparent;color:var(--ink);font-size:14px;font-weight:600;line-height:21px;cursor:pointer}
.seg-btn.on{background:var(--grad)}
.badge{position:absolute;top:-10px;right:6px;padding:0 6px;border-radius:99px;background:var(--required);font-size:10px;font-weight:600;line-height:16px}
.switch-link{display:flex;align-items:center;gap:6px;margin:8px auto 0;min-height:36px;padding:0 8px;background:none;border:0;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}

/* field */
.f{display:flex;flex-direction:column}
.mt12{margin-top:12px}.mt16{margin-top:16px}
.f-label{margin-bottom:8px;font-size:14px;line-height:21px;color:var(--muted)}
.req{color:var(--required)}
.f-box{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 14px;background:var(--field-bg);border:1px solid var(--field-border);border-radius:6px}
.f-box.no-icon{padding-left:12px}
.f-box:focus-within{border-color:var(--field-focus)}
.f-ico{position:relative;display:block;margin-right:4px}
.f-ico svg{display:block}
.f-ico .star{position:absolute;left:15px;top:-6px;color:var(--required);font-size:14px;line-height:14px}
.f-ico.is-flag .star{left:20px;top:-4px}
.flag{display:block;width:20px;height:20px;border-radius:50%;overflow:hidden}
.flag svg{display:block}
.f-code{margin-right:4px}
.f-input{flex:1;min-width:0;height:100%;padding:0;background:transparent;border:0;color:var(--ink);font:400 14px var(--font)}
.f-input::placeholder{color:var(--placeholder)}
.f-input.is-digits::placeholder{letter-spacing:1px}
.f-split{display:flex;gap:10px}
.f-split .f-box{flex:1;min-width:0}
.f-codebox{display:flex;align-items:center;gap:8px;height:44px;flex-shrink:0;padding:0 10px;background:var(--field-bg);border:1px solid var(--field-border);border-radius:6px;color:var(--ink);font-size:14px;cursor:pointer}
.f-codebox .f-ico{margin-right:0}
.f-code{display:flex;align-items:center;gap:8px;padding:0;background:none;border:0;color:var(--ink);font-size:14px;cursor:pointer}
.f-div{width:1px;height:20px;background:var(--toggle-border)}
.f-value{flex:1;font-size:14px}
.f-tools{display:flex;align-items:center;gap:8px}
.f-box:has(.f-btn){padding-right:6px}
.f-btn{height:32px;padding:0 12px;border:0;border-radius:4px;background:var(--grad);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.f-btn:disabled{background:var(--divider);color:#9C9A9E;cursor:default}
.foot.small{margin-top:12px;font-size:13px}
.foot.small .link{font-size:13px;font-weight:400}
.btn-primary.mt-btn{margin-top:12px}
.sub{margin:4px 0 0;text-align:center;font-size:14px;line-height:21px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.steps i{height:4px;border-radius:2px;background:#3A3A40}
.steps i.on{background:var(--grad)}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:24px;text-align:center}
.done-ico{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--grad)}
.done h2{margin:4px 0 0;font-size:18px;font-weight:700;line-height:27px}
.done p{margin:0;font-size:14px;line-height:21px;color:var(--muted)}
.icon-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;background:none;border:0;cursor:pointer}

/* password / PIN toggle */
.toggle{align-self:flex-end;display:flex;gap:2px;margin-top:16px;padding:2px;border:1px solid var(--toggle-border);border-radius:99px}
.toggle-btn{height:26px;padding:0 12px;border:0;border-radius:99px;background:transparent;color:var(--muted-2);font-size:12px;line-height:26px;cursor:pointer}
.toggle-btn.on{background:var(--green);color:var(--ink)}

/* PIN – 6 boxes */
.pin-label{margin-top:16px;font-size:14px;line-height:21px}
.pin-wrap{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
.pin-wrap.full .pin-boxes{flex:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.pin-wrap.full .pin-box{width:auto}
.pin-boxes{position:relative;display:flex;gap:8px}
.pin-box{display:flex;align-items:center;justify-content:center;width:45px;height:50px;background:var(--field-bg);border:1px solid var(--field-border);border-radius:5px;font-size:16px}
.pin-box.active{border-color:var(--field-focus)}
.pin-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px;cursor:text}
.pin-eye{display:flex}
/* PIN – single field */
.pin-f{margin-top:16px}
.pin-mid{position:relative;flex:1;align-self:stretch;display:flex;align-items:center}
.pin-slots{display:flex;justify-content:space-between;gap:10px;width:100%;max-width:240px}
.pin-slot{width:24px;min-height:26px;text-align:center;border-bottom:2px solid var(--placeholder);font-size:18px;line-height:24px}
.pin-slot.filled{border-color:var(--ink)}
.pin-slot.active{border-color:var(--lime)}
.pin-plain{font-size:14px;letter-spacing:.2em}
.pin-plain.empty{color:var(--placeholder);letter-spacing:0}

/* remember / forgot / terms */
.row{display:flex;align-items:center;justify-content:space-between;margin-top:20px;font-size:14px;line-height:21px}
.check-btn{display:flex;align-items:center;gap:7px;padding:0;background:none;border:0;color:var(--muted);font-size:14px;line-height:21px;text-align:left;cursor:pointer}
.check{display:flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0;border-radius:100%;border:1px solid var(--toggle-border)}
.check.on{background:var(--green);border-color:var(--green)}
.plain-btn{padding:0;background:none;border:0;color:var(--ink);font-size:14px;line-height:21px;cursor:pointer}
.terms{align-items:flex-start;margin-top:16px}
.terms .check{margin-top:2px}
.terms u{color:var(--ink)}
.ref-toggle{display:flex;align-items:center;gap:8px;margin-top:16px;padding:0;background:none;border:0;color:var(--muted);font-size:14px;line-height:21px;cursor:pointer}
.ref-toggle svg,.tri{transition:transform .15s ease}
.tri{display:flex}
.ref-toggle.open svg,.tri.up{transform:rotate(180deg)}

/* CTA + footer */
.btn-primary{display:block;width:100%;height:45px;margin-top:16px;border:0;border-radius:6px;background:var(--grad);color:var(--ink);font-size:18px;font-weight:600;line-height:27px;letter-spacing:1.2px;cursor:pointer;opacity:.6}
.btn-primary.ready{opacity:1}
.btn-primary,.btn-grey{display:flex;align-items:center;justify-content:center;gap:10px}
.btn-primary svg,.btn-grey svg{flex-shrink:0}
.btn-upper .btn-primary,.btn-upper .btn-grey{text-transform:uppercase}
.foot{display:flex;justify-content:center;gap:8px;margin-top:16px;font-size:14px;font-weight:700;line-height:21px}
.link{padding:0;background:none;border:0;color:var(--green);font-size:14px;font-weight:700;line-height:21px;text-decoration:underline;cursor:pointer}

/* ===== states & interactions ===== */
.f{position:relative}
.f-err{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--error);font-size:12px;line-height:18px}
.f-err svg{flex-shrink:0}
.has-err .f-box,.has-err .f-codebox,.has-err .pin-box{border-color:var(--error)}
.has-err .pin-slot{border-color:var(--error)}
.terms-wrap.has-err .check{border-color:var(--error)}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake .pin-boxes,.shake .f-box{animation:shake .35s ease}
.btn-primary.loading{display:flex;align-items:center;justify-content:center;gap:10px;cursor:wait}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.f-code,.f-codebox{cursor:default}
[data-act="cc"]{cursor:pointer}
.cc-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:100%;max-width:320px;padding:6px;background:var(--popover);border:1px solid var(--divider);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.cc-search{width:100%;height:36px;margin-bottom:6px;padding:0 10px;background:var(--field-bg);border:1px solid var(--divider);border-radius:6px;color:var(--ink);font:400 14px var(--font)}
.cc-search::placeholder{color:#7A7A80}
.cc-search:focus{border-color:var(--field-focus)}
.cc-list{max-height:220px;overflow:auto}
.cc-item{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--ink);font-size:14px;text-align:left;cursor:pointer}
.cc-item[hidden]{display:none}
.cc-item:hover,.cc-item:focus-visible{background:var(--hover);outline:none}
.cc-item.on{background:rgba(4,120,87,.22)}
.cc-name{flex:1}
.cc-dial{color:var(--muted)}
.cc-empty{padding:10px;color:var(--muted);font-size:13px}
.tip-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:240px;padding:10px 12px;background:#F4F4F5;color:#18181B;border-radius:8px;font-size:12px;line-height:18px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip-pop::before{content:"";position:absolute;right:12px;top:-5px;width:10px;height:10px;background:#F4F4F5;transform:rotate(45deg)}
.rules{display:none;margin-top:8px}
.rules.show,.f:focus-within .rules{display:block}
.meter{display:flex;align-items:center;gap:4px}
.meter i{flex:1;height:4px;border-radius:2px;background:#3A3A40}
.meter-t{min-width:60px;text-align:right;font-size:12px;color:var(--muted)}
.rules[data-lvl="1"] .meter i:nth-child(1){background:var(--error)}
.rules[data-lvl="2"] .meter i:nth-child(-n+2){background:var(--warning)}
.rules[data-lvl="3"] .meter i{background:var(--success)}
.rules ul{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;padding:0;list-style:none;font-size:12px;line-height:18px;color:#8A8A90}
.rules li::before{content:"○";margin-right:5px}
.rules li.ok{color:var(--success)}
.rules li.ok::before{content:"✓"}
.toasts{position:fixed;left:50%;top:16px;z-index:50;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:max-content;max-width:calc(100% - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;background:var(--popover);border:1px solid var(--divider);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.5);font-size:14px;line-height:20px;animation:tin .2s ease}
.toast .t-ico{display:flex}

.f-ok{display:none;line-height:0}

.summary{display:flex;flex-direction:column;gap:10px;margin:16px 0 0;padding:16px;background:var(--raised);border-radius:8px;font-size:14px;line-height:21px}

.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:600;text-align:right;word-break:break-all}
.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}
.btn-row .btn-primary{margin-top:0}
.btn-grey{height:45px;border:0;border-radius:6px;background:var(--btn-grey);color:var(--ink);font-size:18px;font-weight:600;letter-spacing:1.2px;cursor:pointer}
.btn-grey:hover{filter:brightness(1.08)}
.done-title{padding:20px 0 10px;text-align:center;font-size:20px;font-weight:700;line-height:30px;text-transform:uppercase}
.notes{margin:8px 0 0;padding:14px 16px 14px 34px;background:var(--raised);border-radius:8px;font-size:14px;line-height:21px;color:var(--ink)}
.notes li+li{margin-top:6px}
.creds{margin-top:16px;padding:0 16px;border:1px solid var(--divider);border-radius:8px}
.cred{display:flex;align-items:center;gap:8px;height:56px;font-size:14px}
.cred+.cred{border-top:1px solid var(--divider)}
.cred-k{flex:1;color:var(--muted)}

.btn-primary.btn-narrow{width:176px;align-self:center;margin-top:20px}
.hl{outline:2px dashed var(--lime);outline-offset:6px;border-radius:8px;animation:hl 1.8s ease}
@keyframes hl{0%,60%{outline-color:var(--lime)}100%{outline-color:transparent}}

}

/* ---------- validation ---------- */
function vPhone(v){ if(!v) return 'Please enter your mobile number'; return /^\d{8,10}$/.test(v.replace(/[\s-]/g,''))?null:'Enter a valid mobile number (8–10 digits)'; }
function vEmail(v){ if(!v) return 'Please enter your email'; return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?null:'Enter a valid email address'; }
function vUser(v){ if(!v) return 'Please enter a username'; return /^[A-Za-z0-9]{4,12}$/.test(v)?null:'Username must be 4–12 letters or numbers'; }
function vNewPwd(v){ if(!v) return 'Please enter a password'; if(v.length<6||v.length>16) return 'Password must be 6–16 characters'; return (/[A-Za-z]/.test(v)&&/\d/.test(v))?null:'Use at least 1 letter and 1 number'; }
function vPin(v){ return v.length===6?null:(v?'Enter all 6 digits':'Please enter your 6-digit PIN'); }
function vMatch(a,b,w){ if(!b) return w==='PIN'?'Please confirm your PIN':'Please confirm your password'; return a===b?null:(w==='PIN'?'PINs do not match':'Passwords do not match'); }
function vAcc(v){ if(!v) return 'Please enter your account number'; return /^\d{8,20}$/.test(v.replace(/\s/g,''))?null:'Account number must be 8–20 digits'; }
function vName(v){ if(!v) return 'Please enter the account holder name'; return /^[A-Za-z][A-Za-z .'-]{1,}$/.test(v.trim())?null:'Use letters only, as shown on your bank account'; }
function isValid(k){ return k==='su_acc'?!vAcc(S[k]):k==='su_name'?!vName(S[k]):false; }
function idCheck(v){ var m=CFG.accountSwitch==='inline'?S.accMode:S.method; return m==='mobile'?vPhone(v):m==='email'?vEmail(v):(v?null:'Please enter your username'); }
function validate(){
  var e={}; function put(k,m){ if(m) e[k]=m; }
  if(S.tab==='login'){
    put('id',idCheck(S.id));
    if(S.auth==='password') put('pwd',S.pwd?null:'Please enter your password'); else put('pin',vPin(S.pin));
  } else if(S.tab==='signup'&&S.suStep===2){
    put('su_bank',S.su_bank?null:'Please select your bank');
    put('su_acc',vAcc(S.su_acc)); put('su_name',vName(S.su_name));
  } else if(S.tab==='signup'&&S.suStep>2){
  } else if(S.tab==='signup'){
    suNeed().forEach(function(b){ var v=S[b]; put(b, b==='su_user'?vUser(v):b==='su_phone'?vPhone(v):b==='su_email'?vEmail(v):b==='su_sms'?(/^\d{6}$/.test(v)?null:'Enter the 6-digit SMS code'):(/^\d{6}$/.test(v)?null:'Enter the 6-digit email code')); });
    if(S.auth==='password'){ put('su_pwd',vNewPwd(S.su_pwd)); put('su_pwd2',vMatch(S.su_pwd,S.su_pwd2,'password')); }
    else { put('su_pin',vPin(S.su_pin)); put('su_pin2',vMatch(S.su_pin,S.su_pin2,'PIN')); }
    if(!S.agree) e.agree='Please accept the Terms & Conditions to continue';
  } else if(S.fpStep===1){
    put('fp_id',idCheck(S.fp_id));
  } else if(S.fpStep===2){
    put('fp_code',/^\d{6}$/.test(S.fp_code)?null:'Enter the 6-digit verification code');
    if(S.auth==='password'){ put('fp_pwd',vNewPwd(S.fp_pwd)); put('fp_pwd2',vMatch(S.fp_pwd,S.fp_pwd2,'password')); }
    else { put('fp_pin',vPin(S.fp_pin)); put('fp_pin2',vMatch(S.fp_pin,S.fp_pin2,'PIN')); }
  }
  return e;
}

    $('meta').textContent=(W<768?'Mobile ':'Desktop ')+W+' × '+H+(s<1?'  ·  shown at '+Math.round(s*100)+'%':'');
  }
  function write(d){
    pv.removeAttribute('srcdoc');
    try{ var dd=pv.contentDocument; if(!dd) throw new Error('no doc'); dd.open(); dd.write(d); dd.close(); }
    catch(e){ pv.srcdoc=d; }
  }
  function load(){ sync(); draw(); write(doc()); size(); }
  document.addEventListener('click',function(e){
    if(e.target.closest('#resetAll')){ ALL.forEach(function(o){ if(o[0]==='template') return; V[o[0]]=isDesign(o[0])?siteOf(o[0]):DEF[o[0]]; }); V.suStep='1'; V.fpStep='1'; RT={}; FOCUS=''; HINT='Everything reset to the '+refName()+' look'; load(); return; }
    var p=e.target.closest('[data-preset]');
    if(p){ var pr=PRESETS.filter(function(x){return x[0]===p.dataset.preset;})[0]; ALL.forEach(function(o){ if(isDesign(o[0])) V[o[0]]=pr[3][o[0]]||siteOf(o[0]); }); HINT={site:'Back to the live site look',new:'New design applied — try Mobile and PIN',esite:'EW8 form style in 22FUN green',eplus:'EW8 with language, icon social and PIN',gsite:'GOJUDI design (22FUN green)',gplus:'GOJUDI with language, icon social on top and PIN'}[pr[0]]; load(); return; }
    var b=e.target.closest('button[data-k]'); if(!b) return;
    var k=b.dataset.k;
    if(MULTI.indexOf(k)>=0&&b.dataset.t){ var cur=V[k].split(','), t=b.dataset.t, i=cur.indexOf(t); if(i>=0){ if(cur.length===1){ HINT='Keep at least one'; draw(); return; } cur.splice(i,1); } else cur.push(t); V[k]=['u','m','e'].filter(function(x){return cur.indexOf(x)>=0;}).join(','); }
    else V[k]=b.dataset.v;
    if(k==='template'){ ALL.forEach(function(o){ if(isDesign(o[0])) V[o[0]]=siteOf(o[0]); }); }
    if(k==='page'){ V.suStep='1'; V.fpStep='1'; }
    if(k==='resultStyle'){ if(V.page==='forgot') V.fpStep='3'; else { V.page='signup'; V.suStep='4'; } }
    if(k==='confirmStep'&&V.confirmStep==='skip'&&V.suStep==='3') V.suStep='4';
    if(k==='template'||k==='accountSwitch'||k==='accTypes'){ delete RT.method; delete RT.accMode; }
    if(k==='template'||k==='suFields'||k==='suMethod') delete RT.suMethod;
    if(k==='showAuthToggle'||k==='defaultAuth') delete RT.auth;
    FOCUS=(k==='page'||k==='w'||k==='suStep'||k==='fpStep')?'':k;
    HINT=k==='accTypes'?(V.accTypes.split(',').length<2?'One account type — no tabs on Login and Forgot Password':'Login with: '+V.accTypes.split(',').map(function(x){return TNAME[x];}).join(' / ')):k==='suFields'?('Sign up with: '+V.suFields.split(',').map(function(x){return TNAME[x];}).join(' + ')+(V.suFields.split(',').length<2?' — no tabs':'')):((HINTS[k]&&HINTS[k][V[k]])||'');
    if(k==='w'){ sync(); draw(); size(); } else load();
    FOCUS='';
  });
  panel.addEventListener('toggle',function(e){ var d=e.target; if(d.tagName==='DETAILS') openGroups[d.dataset.g]=d.open; },true);
  varBtn.addEventListener('click',function(){ panel.hidden=!panel.hidden; varBtn.textContent=panel.hidden?'Show options':'Hide options'; varBtn.setAttribute('aria-expanded',String(!panel.hidden)); size(); });
  $('copy').addEventListener('click',function(){ var t=location.href; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ $('copy').textContent='Copied ✓'; setTimeout(function(){$('copy').textContent='Copy link';},1500); },function(){ window.prompt('Copy this link:',t); }); });
  window.addEventListener('resize',size);
  $('open').addEventListener('click',function(){ window.open(URL.createObjectURL(new Blob([doc()],{type:'text/html'})),'_blank'); });
  $('dl').addEventListener('click',function(){
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([doc()],{type:'text/html'}));
    a.download=(V.template==='gojudi'?'gojudi-':V.template==='ew8'?'ew8-':'22fun-')+V.page+(location.search?'-'+location.search.slice(1).replace(/[^a-z0-9]+/gi,'-').slice(0,60):'-site')+'.html'; a.click();
  });
  load();
})();
</script>
</body>
